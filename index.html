<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro">
    <span class="theme-text">Modo claro</span>
    <span class="switch"></span>
  </button>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>

        <!-- Menú de pausa -->
        <div id="pause-menu" class="pause-menu" role="dialog" aria-labelledby="overlay-title" hidden>
          <div id="pm-main" class="pm-view">
            <button type="button" id="pm-resume">Reanudar</button>
            <button type="button" id="pm-restart">Reiniciar</button>
            <button type="button" id="pm-controls-btn">Ver controles</button>
            <button type="button" id="pm-level" aria-label="Nivel inicial">
              <span>Nivel inicial</span><span>&lsaquo; <b id="pm-level-val">1</b> &rsaquo;</span>
            </button>
          </div>
          <div id="pm-controls" class="pm-view" hidden>
            <ul class="pm-keys">
              <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> mover</li>
              <li><kbd>&uarr;</kbd> / <kbd>X</kbd> rotar</li>
              <li><kbd>&darr;</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
            <button type="button" id="pm-back">Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
