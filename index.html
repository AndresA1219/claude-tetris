<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
      if (/^[a-z]+$/.test(localStorage.getItem('skin') || '')) document.documentElement.dataset.skin = localStorage.getItem('skin');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro">
    <span class="theme-text">Modo claro</span>
    <span class="switch"></span>
  </button>
  <label class="skin-picker" for="skin-select">
    <span class="skin-text">Skin</span>
    <select id="skin-select" aria-label="Skin visual">
      <option value="retro">Retro</option>
      <option value="neon">Neon</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
  </label>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="records-box hidden">
          <form id="name-form" class="name-form hidden" autocomplete="off">
            <label for="name-input">¡Nuevo record! Tu nombre</label>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" placeholder="Anónimo" />
              <button type="submit" id="name-save-btn">Guardar</button>
            </div>
          </form>
          <div id="gameover-table"></div>
          <p id="gameover-stats" class="records-stats"></p>
          <button type="button" id="gameover-clear-btn" class="records-clear">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <button type="button" id="start-btn">Jugar</button>
        <div class="records-box">
          <p class="records-heading">RECORDS</p>
          <div id="start-table"></div>
          <p id="start-stats" class="records-stats"></p>
          <button type="button" id="start-clear-btn" class="records-clear">Borrar records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
